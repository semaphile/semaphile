# Shape of the inventory run.sh generates into the private SEM3_CLOUD_DIR.
# SSH reaches the VM only through an IAP tunnel, with the host key pinned
# from the VM's guest attributes. Placeholders only; never commit real values.
[sem3]
sem3-linux-example1 ansible_user=sem3ops ansible_ssh_private_key_file=/private/dir/id_ed25519 ansible_ssh_common_args='-o UserKnownHostsFile=/private/dir/known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlias=sem3-linux-example1 -o ProxyCommand="gcloud compute start-iap-tunnel sem3-linux-example1 22 --listen-on-stdin --project=example-project-id --zone=us-central1-a --verbosity=warning"'
